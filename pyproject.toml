[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "APiHole"
dynamic = ["version"]
description = "Python client for the Pi-hole v6 REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Shmulik Debby", email = "shmulik.debby@gmail.com" }]
keywords = ["pihole", "pi-hole", "pi.hole", "api", "dns"]
dependencies = ["requests>=2.28"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.23"]

[project.urls]
Homepage = "https://github.com/sdebby/APiHole"
Issues = "https://github.com/sdebby/APiHole/issues"
Changelog = "https://github.com/sdebby/APiHole/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "APiHole/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["APiHole", "tests", "example.py", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["APiHole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
