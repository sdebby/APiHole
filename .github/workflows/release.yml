name: Release

# Pushing a tag like v1.0.0 (or v1.0.0rc1) builds and publishes to PyPI with
# Trusted Publishing: no API token is stored in the repo. One-time setup on
# PyPI: APiHole > Settings > Publishing > add a GitHub publisher with
# owner "sdebby", repo "APiHole", workflow "release.yml", environment "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" build twine
      - run: python -m pytest
      - name: Check tag matches package version
        run: |
          version=$(python -c "import APiHole; print(APiHole.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/APiHole
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
